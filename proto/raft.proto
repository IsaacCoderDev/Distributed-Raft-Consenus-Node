syntax = "proto3";

package raft;

option go_package = "github.com/quant/raft-go/proto;raft";

// ============================================================================
// THE RAFT CONSENSUS SERVICE
// ============================================================================
service RaftService {
  rpc RequestVote(VoteRequest) returns (VoteResponse);
  rpc AppendEntries(AppendRequest) returns (AppendResponse);
}

// ============================================================================
// LOG ENTRY STRUCTURE
// ============================================================================
message LogEntry {
  uint64 term = 1;
  uint64 index = 2;
  bytes command = 3;
}

// ============================================================================
// ELECTION RPCs
// ============================================================================
message VoteRequest {
  uint64 term = 1;
  uint32 candidate_id = 2;
  
  uint64 last_log_index = 3; 
  uint64 last_log_term = 4;  
}

message VoteResponse {
  uint64 term = 1;
  bool vote_granted = 2;
}

// ============================================================================
// LOG REPLICATION & HEARTBEAT RPCs
// ============================================================================
message AppendRequest {
  uint64 term = 1;
  uint32 leader_id = 2;
  uint64 prev_log_index = 3;
  uint64 prev_log_term = 4;
  repeated LogEntry entries = 5;
  uint64 leader_commit = 6;
}

message AppendResponse {
  uint64 term = 1;
  bool success = 2;
  // --------------------------------------------------------------------------
  // FAST BACKTRACKING OPTIMIZATION (Section 5.3 of the Raft Paper)
  // Standard Raft rejects logs one-by-one, which is disastrous over high-latency 
  // networks if a node has been offline for hours. These fields allow the leader 
  // to skip over entire conflicting terms in a single RPC round-trip.
  // --------------------------------------------------------------------------
  uint64 conflict_index = 3; 
  uint64 conflict_term = 4;  
}